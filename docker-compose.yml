services:
  postgres:
    image: postgres:16-alpine
    container_name: finanapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finanapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finanapp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./finanapp-backend
      dockerfile: Dockerfile
    container_name: finanapp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finanapp_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      PORT: 8081
      JWT_SECRET: MiClaveSecretaSuperLargaYSeguraDeMinimo32Caracteres1234567890!
    ports:
      - "8081:8081"

volumes:
  postgres_data:
