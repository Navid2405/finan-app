<div class="space-y-6">
  <!-- Top Bar -->
  <div class="flex items-center justify-between pt-2">
    <button class="p-2 text-[#94A3B8] hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1 class="text-xl font-bold tracking-tight text-white">FinanApp</h1>
    <button class="p-2 text-[#94A3B8] hover:text-white relative">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
      <span class="absolute top-2 right-2 w-2 h-2 bg-[#EF4444] rounded-full"></span>
    </button>
  </div>

  <div class="text-center py-6">
    <span class="text-xs sm:text-sm font-medium text-[#94A3B8] tracking-wider uppercase">Balance Diario</span>
    <div class="text-5xl font-extrabold text-white mt-2 tracking-tight">$85,000</div>
    <span class="text-xs font-semibold text-[#94A3B8] uppercase tracking-widest mt-1 block">COP</span>
  </div>

  <!-- Acciones de ingreso y gasto -->
  <div class="grid grid-cols-2 gap-4">
    <button class="flex items-center justify-center gap-2 py-4 px-4 bg-[#10B981] hover:bg-emerald-600 active:scale-95 text-white font-bold text-base sm:text-lg rounded-2xl shadow-lg shadow-emerald-500/20 transition">
      <span class="text-2xl leading-none">+</span> Ingreso
    </button>

    <button class="flex items-center justify-center gap-2 py-4 px-4 bg-[#EF4444] hover:bg-red-600 active:scale-95 text-white font-bold text-base sm:text-lg rounded-2xl shadow-lg shadow-red-500/20 transition">
      <span class="text-2xl leading-none">-</span> Gasto
    </button>
  </div>

  <!-- Avisos-->
  <div class="bg-[#F59E0B]/10 border border-[#F59E0B]/40 rounded-2xl p-4 flex items-start gap-3.5">
    <div class="p-2 bg-[#F59E0B]/20 text-[#F59E0B] rounded-xl text-lg">⚠️</div>
    <div class="flex-1">
      <h3 class="text-sm font-bold text-[#F59E0B]">Cuota de Seguridad:</h3>
      <p class="text-xs text-amber-200/80 mt-1 leading-relaxed">
        Hoy se le sugiere apartar:<span class="font-bold text-white">$5,000 COP</span>.
      </p>
    </div>
  </div>

  <!-- Widget de Meta de Ahorro -->
  <div class="bg-[#151C2C] border border-slate-800/80 rounded-2xl p-4 space-y-3 shadow-lg">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="p-2 bg-emerald-500/10 text-[#10B981] rounded-xl font-bold">💰</div>
        <span class="text-sm font-semibold text-white">Meta de Ahorro</span>
      </div>
      <span class="text-[#94A3B8] text-sm">›</span>
    </div>

    <!-- Barra de progreso -->
    <div class="w-full bg-[#0B0F19] h-2.5 rounded-full overflow-hidden border border-slate-800">
      <div class="bg-[#10B981] h-full rounded-full" style="width: 70%"></div>
    </div>

    <div class="flex justify-between text-xs text-[#94A3B8] font-medium">
      <span class="text-white font-bold">$85,000 COP</span>
      <span>Meta: $120,000 COP</span>
    </div>
  </div>
</div>
